# Deploys MomotaroFanoutStack to production on every push to main, but only
# after the same code has been deployed to MomotaroFanoutStaging and a real
# takeout order and dine-in order have gone through it end to end.
#
# AWS access is keyless: GitHub's OIDC token is exchanged for the
# momotaro-fanout-github-deploy role, which only trusts pushes to main of this
# repo and can only assume the CDK bootstrap roles and read the stack's .env
# from SSM. The end-to-end job uses a separate staging-only role
# (momotaro-e2e-staging, defined in the staging stack). Pull requests run the
# unit tests but never get AWS credentials.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once; queue the newer one instead of cancelling a
# deploy halfway through. Staging is shared, so the e2e run is inside the lock.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'deploy-prod' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  DEPLOY_ROLE_ARN: arn:aws:iam::798965869505:role/momotaro-fanout-github-deploy
  E2E_ROLE_ARN: arn:aws:iam::798965869505:role/momotaro-e2e-staging
  # The stack's non-Stripe config (table name, IoT endpoint, sender email,
  # CONFIRMATION_TOKEN_SECRET, ...) in .env format. Edit it in SSM, not here.
  DOTENV_PARAM: /momotaro/prod/fanout/DOTENV

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt \
                      -r momotaro_layer/requirements.txt boto3

      # boto3 clients are created at import time and need a region, even
      # though the tests never call AWS. tests/e2e skips itself here.
      - name: Run tests
        env:
          AWS_DEFAULT_REGION: ca-central-1
        run: pytest -q ingress workers tests

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/cdk-deploy
        with:
          stack: MomotaroFanoutStaging
          dotenv-param: ${{ env.DOTENV_PARAM }}

  # Places a takeout order (Stripe test card) and a dine-in order against
  # staging and waits for each to be saved and sent to the (staging) kitchen.
  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt -r momotaro_layer/requirements.txt boto3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.E2E_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Place test orders on staging
        env:
          E2E_STACK_NAME: MomotaroFanoutStaging
        run: pytest -v tests/e2e

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/cdk-deploy
        with:
          stack: MomotaroFanoutStack
          dotenv-param: ${{ env.DOTENV_PARAM }}
