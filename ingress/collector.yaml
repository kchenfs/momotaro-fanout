# collector.yaml is now ONLY needed for routing traces to your Tempo backend.
# Metrics are handled automatically by the ADOT layer via OTEL_METRICS_EXPORTER=awsemf
# and go directly to CloudWatch — no collector pipeline needed for metrics.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

exporters:
  logging:
    verbosity: detailed
  otlphttp:
    endpoint: "https://traces.momotarosushi.ca"
    timeout: 3s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_elapsed_time: 5s

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging, otlphttp]
    # No metrics pipeline here — metrics go to CloudWatch via EMF automatically