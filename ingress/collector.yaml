receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

exporters:
  logging:
    verbosity: detailed
  otlphttp:
    # Point this to your secure Traefik Ingress route
    endpoint: "https://traces.momotarosushi.ca"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging, otlphttp] # Sends to both CloudWatch logs and your K3s server